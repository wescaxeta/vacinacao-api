version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      testes:
        patterns: ["xunit*", "Testcontainers*", "coverlet*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
